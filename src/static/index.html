<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="analytics-container">
        <h3>Staff Analytics: Outcomes</h3>
        <form id="analytics-filters">
          <div class="form-group">
            <label for="filter-start-date">From:</label>
            <input type="date" id="filter-start-date" />
          </div>
          <div class="form-group">
            <label for="filter-end-date">To:</label>
            <input type="date" id="filter-end-date" />
          </div>
          <div class="form-group">
            <label for="filter-academic-year">Academic Year:</label>
            <select id="filter-academic-year">
              <option value="">All academic years</option>
            </select>
          </div>
          <div class="form-group">
            <label for="filter-category">Category:</label>
            <select id="filter-category">
              <option value="">All categories</option>
            </select>
          </div>
          <div class="form-group">
            <label for="filter-status">Review Status:</label>
            <select id="filter-status">
              <option value="">All statuses</option>
            </select>
          </div>
          <button type="submit">Apply Filters</button>
          <button type="reset">Clear</button>
        </form>
        <div id="analytics-metrics" aria-live="polite">
          <p>Loading analytics...</p>
        </div>
        <div id="analytics-breakdown" aria-live="polite"></div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
